# Opacity & padding
background_opacity 0.8
window_padding_width 10
window_margin_width 0

# Performance
repaint_delay 10
input_delay 3

# Font
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11

# Cursor
cursor_shape block
cursor_blink_interval 0

# Scrollback
scrollback_lines 50000
scrollback_pager_history_size 100

# Clipboard
copy_on_select yes
clipboard_control write-clipboard write-primary

# Shell
shell_integration enabled

# Mouse
mouse_hide_wait 2.0

# Tab bar
tab_bar_style powerline
tab_bar_edge bottom
tab_separator " |"
active_tab_foreground #000000
active_tab_background #cba6f7
inactive_tab_foreground #cdd6f4
inactive_tab_background #313244

# Keybindings
map ctrl+shift+enter new_window
map ctrl+shift+t new_tab
map ctrl+shift+w close_window
map ctrl+tab next_tab
map ctrl+shift+tab previous_tab
map ctrl+shift+left neighboring_window left
map ctrl+shift+right neighboring_window right
map ctrl+shift+up neighboring_window up
map ctrl+shift+down neighboring_window down
map ctrl+shift+alt+left resize_window narrower
map ctrl+shift+alt+right resize_window wider
map ctrl+shift+alt+up resize_window taller
map ctrl+shift+alt+down resize_window shorter
map ctrl+shift+z toggle_window_zoom
map ctrl+shift+f toggle_fullscreen
map ctrl+shift+equal change_font_size all +2.0
map ctrl+shift+minus change_font_size all -2.0
map ctrl+shift+backspace change_font_size all 0
